name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # इससे आप GitHub UI से भी मैनुअली वर्कफ़्लो चला सकते हैं

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. रिपॉजिटरी के कोड को चेकआउट करें
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java (JDK 17) सेटअप करें
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Android SDK सेटअप करें (पुरानी tools वाली एरर से बचने के लिए सही कॉन्फ़िगरेशन)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Gradle बिल्ड कैश (Build Cache) सेट करें ताकि बाद में बिल्ड तेज़ी से हो
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 5. gradlew स्क्रिप्ट को एक्ज़ीक्यूटेबल (Executable) परमिशन दें
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 6. Debug APK का निर्माण (Build) करें
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 7. तैयार (Generated) APK फ़ाइल को Artifact के रूप में अपलोड करें ताकि आप उसे डाउनलोड कर सकें
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
