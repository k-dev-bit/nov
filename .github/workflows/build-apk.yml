name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # GitHub Actions टैब से मैन्युअली रन करने के लिए

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. रिपॉजिटरी से कोड डाउनलोड करें
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java (JDK 17) सेटअप करें (आधुनिक एंड्रॉइड प्रोजेक्ट्स के लिए जरूरी)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Android SDK सेटअप करें (बिना किसी पुरानी 'tools' एरर के)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Gradle सेटअप और कैचिंग (Gradle Build Cache)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # 5. gradlew को एक्ज़ीक्यूटेबल (Executable) परमिशन दें
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 6. APK बिल्ड करें ( '--stacktrace --info' जोड़ने से अगर कोई एरर होगी तो वह पूरी तरह दिखेगी)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --info

      # 7. तैयार APK को GitHub Artifacts के रूप में अपलोड करें
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
